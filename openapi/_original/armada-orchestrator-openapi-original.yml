openapi: 3.0.3
info:
  title: Orchestrator API
  description: |
    API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,
    storage, networking, catalogs, quotas, and related infrastructure operations.
  version: 1.0.0
  contact:
    name: GPUaaS Platform

servers:
  - url: /
    description: Relative base (prefix with deployment base URL)

tags:
  - name: Health & Debug
  - name: Log Level
  - name: Tenants
  - name: Tenant Common Storage
  - name: Device Discovery
  - name: Infra Import
  - name: Monetize
  - name: NetQ
  - name: Models
  - name: Storage
  - name: Catalog
  - name: App Catalog
  - name: Metal
  - name: VMs
  - name: Network
  - name: Dashboard
  - name: CMS
  - name: Clusters
  - name: PaaS
  - name: Endpoints
  - name: Features
  - name: Servers
  - name: S3
  - name: Admin Settings
  - name: VPC
  - name: Security Groups
  - name: Templates
  - name: Quotas
  - name: Slurm
  - name: Load Balancers
  - name: Storage Classes
  - name: Datasets
  - name: Data Volumes

paths:
  /health-check:
    get:
      tags: [Health & Debug]
      summary: Health check
      operationId: getHealthCheck
      responses:
        "200":
          description: OK

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /debug/pprof/{profile}:
    get:
      tags: [Health & Debug]
      summary: pprof debug profiles
      parameters:
        - name: profile
          in: path
          required: true
          schema:
