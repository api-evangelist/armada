openapi: 3.2.0
info:
  title: Orchestrator Device Discovery API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: Device Discovery
paths:
  /device-discovery:
    get:
      tags:
      - Device Discovery
      summary: Get topology
      operationId: getTopology
      responses:
        '200':
          description: Topology
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Device Discovery
      summary: Discover topology
      operationId: discoverTopology
      responses:
        '200':
          description: Discovery started/result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
  /device-discovery-status:
    get:
      tags:
      - Device Discovery
      summary: Get device discovery status
      operationId: getDeviceDiscoveryStatus
      responses:
        '200':
          description: Status
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /discovery-status:
    get:
      tags:
      - Device Discovery
      summary: Get discovery status
      operationId: getDiscoveryStatus
      responses:
        '200':
          description: Status
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
    InternalServerError:
      description: Internal Server Error - server error
    Conflict:
      description: Conflict - resource conflict (e.g. duplicate)
    BadRequest:
      description: Bad Request - invalid or malformed request
    Created:
      description: Created - resource created successfully
    NotFound:
      description: Not Found - resource does not exist
    Forbidden:
      description: Forbidden - insufficient permissions
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from auth middleware
