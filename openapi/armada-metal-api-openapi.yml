openapi: 3.2.0
info:
  title: Orchestrator Metal API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: Metal
paths:
  /tenants/{tenant}/metal/allocate:
    post:
      tags:
      - Metal
      summary: Allocate metal
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Metal allocated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postTenantsByTenantMetalAllocate
      x-operation-id-source: derived
  /tenants/{tenant}/metal/{computeNodeId}/deallocate:
    post:
      tags:
      - Metal
      summary: Deallocate metal
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: computeNodeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deallocated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postTenantsByTenantMetalByComputeNodeIdDeallocate
      x-operation-id-source: derived
  /tenants/{tenant}/metal/computes:
    get:
      tags:
      - Metal
      summary: List computes
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of computes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantMetalComputes
      x-operation-id-source: derived
  /tenants/{tenant}/metal/computes/{computeNodeId}:
    get:
      tags:
      - Metal
      summary: Get compute by ID
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: computeNodeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Compute
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantMetalComputesByComputeNodeId
      x-operation-id-source: derived
  /metal/flavour:
    get:
      tags:
      - Metal
      summary: Get metal flavours
      operationId: getMetalFlavours
      responses:
        '200':
          description: List of flavours
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /storages:
    get:
      tags:
      - Metal
      summary: List all storage nodes
      operationId: fetchAllStorageNodes
      responses:
        '200':
          description: List of storage nodes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /storages/{storageNodeId}:
    get:
      tags:
      - Metal
      summary: Get storage node by ID
      parameters:
      - name: storageNodeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Storage node
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getStoragesByStorageNodeId
      x-operation-id-source: derived
  /osimages:
    get:
      tags:
      - Metal
      summary: Get OS images
      operationId: getOsImages
      responses:
        '200':
          description: List of OS images
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
    InternalServerError:
      description: Internal Server Error - server error
    Conflict:
      description: Conflict - resource conflict (e.g. duplicate)
    BadRequest:
      description: Bad Request - invalid or malformed request
    Created:
      description: Created - resource created successfully
    NotFound:
      description: Not Found - resource does not exist
    Forbidden:
      description: Forbidden - insufficient permissions
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from auth middleware
