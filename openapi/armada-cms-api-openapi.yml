openapi: 3.2.0
info:
  title: Orchestrator CMS API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: CMS
paths:
  /cms/api/v1/tenants/{tenantID}/vms:
    get:
      tags:
      - CMS
      summary: CMS - List VMs
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of VMs
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getCmsApiV1TenantsByTenantIDVms
      x-operation-id-source: derived
    post:
      tags:
      - CMS
      summary: CMS - Allocate VM
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: VM allocated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postCmsApiV1TenantsByTenantIDVms
      x-operation-id-source: derived
  /cms/api/v1/tenants/{tenantID}/vms/{vmId}:
    get:
      tags:
      - CMS
      summary: CMS - Get VM
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: vmId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: VM
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getCmsApiV1TenantsByTenantIDVmsByVmId
      x-operation-id-source: derived
    delete:
      tags:
      - CMS
      summary: CMS - Deallocate VM
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: vmId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deallocated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          $ref: '#/components/responses/NoContent'
      operationId: deleteCmsApiV1TenantsByTenantIDVmsByVmId
      x-operation-id-source: derived
  /cms/api/v1/tenants/{tenantID}/flavour:
    get:
      tags:
      - CMS
      summary: CMS - Get VM flavours
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of flavours
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getCmsApiV1TenantsByTenantIDFlavour
      x-operation-id-source: derived
components:
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
    InternalServerError:
      description: Internal Server Error - server error
    NoContent:
      description: No Content - success with no response body
    Conflict:
      description: Conflict - resource conflict (e.g. duplicate)
    BadRequest:
      description: Bad Request - invalid or malformed request
    Created:
      description: Created - resource created successfully
    NotFound:
      description: Not Found - resource does not exist
    Forbidden:
      description: Forbidden - insufficient permissions
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from auth middleware
