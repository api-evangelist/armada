openapi: 3.2.0
info:
  title: Orchestrator Catalog API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: Catalog
paths:
  /catalog:
    get:
      tags:
      - Catalog
      summary: Get catalog
      operationId: getCatalog
      responses:
        '200':
          description: Catalog
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalog/{catalogID}:
    get:
      tags:
      - Catalog
      summary: Get catalog by ID
      parameters:
      - name: catalogID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Catalog
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getCatalogByCatalogID
      x-operation-id-source: derived
  /catalog/{catalogID}/product-types/{productTypeID}/pricing:
    post:
      tags:
      - Catalog
      summary: Update product type pricing
      parameters:
      - name: catalogID
        in: path
        required: true
        schema:
          type: string
      - name: productTypeID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pricing updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postCatalogByCatalogIDProductTypesByProductTypeIDPricing
      x-operation-id-source: derived
  /tenants/{tenant}/catalog:
    get:
      tags:
      - Catalog
      summary: Get tenant catalog
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tenant catalog
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantCatalog
      x-operation-id-source: derived
  /tenants/{tenant}/product-types/{productTypeID}:
    delete:
      tags:
      - Catalog
      summary: Delete catalog tenant price
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: productTypeID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          $ref: '#/components/responses/NoContent'
      operationId: deleteTenantsByTenantProductTypesByProductTypeID
      x-operation-id-source: derived
components:
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
    InternalServerError:
      description: Internal Server Error - server error
    NoContent:
      description: No Content - success with no response body
    Conflict:
      description: Conflict - resource conflict (e.g. duplicate)
    BadRequest:
      description: Bad Request - invalid or malformed request
    Created:
      description: Created - resource created successfully
    NotFound:
      description: Not Found - resource does not exist
    Forbidden:
      description: Forbidden - insufficient permissions
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from auth middleware
