      x-operation-id-source: derived
    post:
      tags:
      - Clusters
      summary: Enable MIG
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: MIG enabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
