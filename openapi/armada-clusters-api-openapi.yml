openapi: 3.2.0
info:
  title: Orchestrator Clusters API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: Clusters
paths:
  /tenants/{tenant}/clusters:
    get:
      tags:
      - Clusters
      summary: List clusters
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of clusters
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantClusters
      x-operation-id-source: derived
    post:
      tags:
      - Clusters
      summary: Create cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cluster created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postTenantsByTenantClusters
      x-operation-id-source: derived
  /tenants/{tenant}/clusters/external:
    post:
      tags:
      - Clusters
      summary: Onboard external cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: External cluster onboarded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postTenantsByTenantClustersExternal
      x-operation-id-source: derived
  /tenants/{tenant}/clusters/{clusterID}:
    get:
      tags:
      - Clusters
      summary: Get cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cluster
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantClustersByClusterID
      x-operation-id-source: derived
    patch:
      tags:
      - Clusters
      summary: Update cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: patchTenantsByTenantClustersByClusterID
      x-operation-id-source: derived
    put:
      tags:
      - Clusters
      summary: Scale cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scaled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: putTenantsByTenantClustersByClusterID
      x-operation-id-source: derived
    delete:
      tags:
      - Clusters
      summary: Delete cluster
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          $ref: '#/components/responses/NoContent'
      operationId: deleteTenantsByTenantClustersByClusterID
      x-operation-id-source: derived
  /tenants/{tenant}/clusters/{clusterID}/kubeconfig:
    get:
      tags:
      - Clusters
      summary: Get cluster kubeconfig
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Kubeconfig
        '400':
