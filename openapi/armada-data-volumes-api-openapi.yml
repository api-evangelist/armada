openapi: 3.2.0
info:
  title: Orchestrator Data Volumes API
  description: 'API for the GPUaaS Orchestrator microservice. Handles tenants, clusters, VMs,

    storage, networking, catalogs, quotas, and related infrastructure operations.'
  version: 1.0.0
  contact:
    name: GPUaaS Platform
servers:
- url: /
  description: Relative base (prefix with deployment base URL)
security:
- bearerAuth: []
tags:
- name: Data Volumes
paths:
  /tenants/{tenant}/clusters/{clusterID}/volumes:
    get:
      tags:
      - Data Volumes
      summary: List data volumes
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of volumes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantClustersByClusterIDVolumes
      x-operation-id-source: derived
    post:
      tags:
      - Data Volumes
      summary: Create data volume
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Volume created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postTenantsByTenantClustersByClusterIDVolumes
      x-operation-id-source: derived
  /tenants/{tenant}/clusters/{clusterID}/volumes/{id}:
    get:
      tags:
      - Data Volumes
      summary: Get data volume
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Volume
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getTenantsByTenantClustersByClusterIDVolumesById
      x-operation-id-source: derived
    delete:
      tags:
      - Data Volumes
      summary: Delete data volume
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          $ref: '#/components/responses/NoContent'
      operationId: deleteTenantsByTenantClustersByClusterIDVolumesById
      x-operation-id-source: derived
components:
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
    InternalServerError:
      description: Internal Server Error - server error
    NoContent:
      description: No Content - success with no response body
    Conflict:
      description: Conflict - resource conflict (e.g. duplicate)
    BadRequest:
      description: Bad Request - invalid or malformed request
    Created:
      description: Created - resource created successfully
    NotFound:
      description: Not Found - resource does not exist
    Forbidden:
      description: Forbidden - insufficient permissions
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from auth middleware
