aid: armada
name: Armada
description: >-
  Armada is an edge computing company that deploys full-stack compute, connectivity, and AI
  infrastructure into remote and disconnected environments. Its platform spans Atlas (an enterprise
  console for monitoring and managing distributed IoT and edge assets), Galleon (ruggedized, rapidly
  deployable modular data centers), and Bridge (a GPU cloud management platform / PaaS that provisions
  and orchestrates bare-metal, virtual-machine, and Kubernetes GPU workloads across NVIDIA and AMD
  hardware). The Bridge Orchestrator API exposes tenants, clusters, VMs, storage, networking, catalogs,
  and quota operations for building sovereign and edge AI clouds, and an OpenAI-compatible
  Model-as-a-Service inference API is available through Bridge AI Studio.
